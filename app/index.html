<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff5a3c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SettleMate">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>SettleMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: upbeat, warm, a little playful, like a friend who has already done this
   IDEA: a sticker-covered student planner: bold colour tiles, progress rings, small rewards
   PICTURE: the working app in a phone, with coloured blobs behind it
   COLOUR and TYPE: coral #ff5a3c lead, sunshine #ffc93c, electric blue #3d6bff, mint for completed; Fredoka headings, Plus Jakarta Sans body
   LAYOUT: modest title, phone centred; on phones the app fills the screen with a floating pill nav */
:root{color-scheme:light dark;
--bg:light-dark(#fff7f0,#0f1020);--app:light-dark(#fffdfa,#171a2e);--card:light-dark(#ffffff,#21253d);
--ink:light-dark(#1b1d2e,#f1f2fa);--mute:light-dark(#6b6f86,#a4a8c3);--line:light-dark(#f0e6dc,#2e3352);
--coral:#ff5a3c;--sun:#ffc93c;--blue:#3d6bff;--mint:#1fbf8f;--pink:#ff7eb6;
--coralsoft:light-dark(#ffe6df,#3b2028);--sunsoft:light-dark(#fff2cc,#3a3220);--bluesoft:light-dark(#e3eaff,#1f2a55);--mintsoft:light-dark(#d9f7ec,#163a32);--pinksoft:light-dark(#ffe3ef,#3b1f33);
--shadow:0 6px 18px -8px light-dark(rgb(255 90 60/.35),rgb(0 0 0/.6))}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1,h2,h3,.big,.disp{font-family:Fredoka,"Plus Jakarta Sans",sans-serif;font-weight:600}
.top{max-width:1000px;margin:0 auto;padding:28px 20px 6px;display:flex;flex-wrap:wrap;gap:8px 24px;align-items:end;justify-content:space-between}
.top h1{margin:0;font-size:34px;line-height:1.05}
.top p{margin:0;color:var(--mute);max-width:44ch}
.stage{position:relative;display:flex;justify-content:center;padding:18px 16px 40px;isolation:isolate}
.blob{position:absolute;border-radius:50%;filter:blur(2px);z-index:-1}
.phone{width:392px;height:800px;background:var(--app);border-radius:46px;border:10px solid #14152a;box-shadow:0 40px 80px -30px rgb(40 20 80/.45);display:flex;flex-direction:column;overflow:hidden;position:relative}
.status{display:flex;justify-content:space-between;padding:10px 26px 2px;font-size:13px;font-weight:700}
.screen{flex:1;overflow-y:auto;padding:8px 18px 110px;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.nav{position:absolute;left:14px;right:14px;bottom:14px;display:grid;grid-template-columns:repeat(5,1fr);background:var(--ink);border-radius:26px;padding:6px;box-shadow:0 12px 30px -10px rgb(0 0 0/.5);z-index:3}
.nav button{background:none;border:0;display:grid;justify-items:center;gap:1px;font-size:11px;font-weight:600;color:light-dark(#b9bcd2,#5c6185);min-height:52px;border-radius:20px;padding:5px 0;transition:background .2s,color .2s}
.nav button[aria-current=true]{background:var(--coral);color:#fff}
.nav svg{width:22px;height:22px}
h2{font-size:28px;line-height:1.05;margin:6px 0 4px}
h3{font-size:18px;margin:0 0 8px}
.sub{color:var(--mute);margin:0 0 14px;font-size:15px}
.card{background:var(--card);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-size:34px;line-height:1;white-space:nowrap}
.small{font-size:13px;color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.hello{display:flex;align-items:center;gap:12px;margin:6px 0 14px}
.avatar{flex:none;width:48px;height:48px;border-radius:16px;background:var(--sun);color:#1b1d2e;display:grid;place-items:center;font:700 20px Fredoka,sans-serif;transform:rotate(-6deg)}
.hero{position:relative;overflow:hidden;background:var(--coral);color:#fff;border-radius:26px;padding:18px;margin-bottom:14px;display:grid;grid-template-columns:minmax(0,1fr) 96px;gap:10px;align-items:center}
.hero .disp{font-size:21px;line-height:1.15;margin:4px 0 12px}
.hero small{opacity:.85;font-weight:600}
.ring{position:relative;width:96px;height:96px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 22px Fredoka,sans-serif}
.ring circle{transition:stroke-dasharray .6s}
.btn{background:var(--coral);color:#fff;border:0;border-radius:16px;padding:10px 16px;min-height:44px;font-weight:700}
.btn.w{background:#fff;color:var(--coral)}
.btn.soft{background:var(--bluesoft);color:var(--blue)}
.tiles{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:14px}
.tile{border:0;text-align:left;border-radius:22px;padding:14px;display:grid;gap:4px;min-height:132px;align-content:space-between;color:#1b1d2e}
.tile .ic{width:38px;height:38px;border-radius:12px;background:rgb(255 255 255/.6);display:grid;place-items:center}
.tile .ic svg{width:22px;height:22px}
.tile .big{font-size:28px}
.t-blue{background:#c9d6ff}.t-sun{background:#ffe08a}.t-mint{background:#b5efd9}.t-pink{background:#ffc9df}
.meter{height:10px;border-radius:6px;background:rgb(27 29 46/.12);overflow:hidden}
.meter i{display:block;height:100%;border-radius:6px;background:#1b1d2e;transition:width .5s}
.hscroll{display:flex;gap:12px;overflow-x:auto;margin:0 -18px 14px;padding:4px 18px 10px;scroll-snap-type:x mandatory;scrollbar-width:none}
.hscroll::-webkit-scrollbar{display:none}
.event{flex:none;width:200px;scroll-snap-align:start;border-radius:22px;overflow:hidden;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.event .cover{height:86px;position:relative}
.event .cover svg{position:absolute;inset:0;width:100%;height:100%}
.event .body{padding:10px 12px 12px}
.event b{display:block;line-height:1.25}
.task{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:var(--card);border:1px solid var(--line);margin-bottom:10px;transition:background .3s}
.task.done{background:var(--mintsoft);border-color:transparent}
.task.done b{text-decoration:line-through;opacity:.6}
.tick{flex:none;width:34px;height:34px;border-radius:12px;border:2.5px solid var(--line);background:var(--app);display:grid;place-items:center;padding:0;color:#fff;font-weight:800}
.tick[aria-pressed=true]{background:var(--mint);border-color:var(--mint);animation:pop .35s}
.xp{flex:none;font-size:12px;font-weight:800;color:var(--blue);background:var(--bluesoft);border-radius:10px;padding:3px 8px}
.task.done .xp{color:var(--mint);background:transparent}
form.add{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,.8fr) auto;gap:8px}
input,select{font-size:16px;border:1.5px solid var(--line);background:var(--app);border-radius:14px;padding:9px 11px;min-height:44px;width:100%}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line)}
.list li:last-child{border:0}
.del{background:none;border:0;color:var(--mute);min-width:36px;min-height:36px;border-radius:12px}
.alert{border-radius:16px;padding:11px 13px;font-size:14px;font-weight:600;margin-top:12px}
.alert.r{background:var(--coralsoft);color:var(--coral)}.alert.y{background:var(--sunsoft);color:light-dark(#8a6100,#ffc93c)}.alert.g{background:var(--mintsoft);color:var(--mint)}
.gauge{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.gauge .ring{width:150px;height:150px}
.gauge .ring b{font-size:34px;flex-direction:column;line-height:1}
.gauge .ring b span{display:block;font:600 13px "Plus Jakarta Sans",sans-serif;color:var(--mute);margin-top:4px;text-align:center}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips button{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:16px;padding:7px 14px;min-height:42px;font-size:14px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--app);border-color:var(--ink)}
.quick button{background:var(--sunsoft);border-color:transparent}
.donut{display:grid;grid-template-columns:130px minmax(0,1fr);gap:14px;align-items:center}
.donut svg{width:130px;height:130px;transform:rotate(-90deg)}
.legend{display:grid;gap:6px;font-size:14px}
.legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:4px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-weight:700}
.deal{display:flex;gap:12px;align-items:center;padding:9px 0}
.badge{flex:none;width:50px;height:50px;border-radius:16px;display:grid;place-items:center}
.badge svg{width:26px;height:26px}
.group{display:flex;gap:12px;align-items:center}
.gav{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:700 16px Fredoka,sans-serif;color:#1b1d2e}
.fab{position:absolute;right:20px;bottom:96px;height:52px;padding:0 18px 0 14px;border-radius:26px;background:var(--blue);color:#fff;border:0;display:flex;gap:8px;align-items:center;font-weight:700;box-shadow:0 12px 24px -8px rgb(61 107 255/.7);z-index:3}
.fab svg{width:22px;height:22px}
.sheet{position:absolute;inset:auto 0 0 0;height:80%;background:var(--app);border-radius:28px 28px 0 0;box-shadow:0 -10px 40px rgb(0 0 0/.25);display:flex;flex-direction:column;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1.1);z-index:5}
.sheet.open{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:10px auto 0}
.msgs{flex:1;overflow-y:auto;padding:8px 16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:85%;padding:10px 14px;border-radius:20px;font-size:15px}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.m.bot{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px}
.sheet .chips{padding:4px 16px 8px}
.sheet form{display:flex;gap:8px;padding:8px 16px 20px}
.toast{position:absolute;left:50%;top:56px;transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--app);border-radius:20px;padding:9px 16px;font-weight:700;font-size:14px;white-space:nowrap;transition:.3s;z-index:6;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.conf{position:absolute;width:9px;height:14px;border-radius:3px;z-index:6;pointer-events:none;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@keyframes pop{50%{transform:scale(1.25)}}
a.deal,a.event{color:inherit;text-decoration:none}a.event{display:block}a.deal:hover b,a.event:hover b{text-decoration:underline}
.go{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:var(--blue);text-decoration:none;min-height:24px}
.go:hover{text-decoration:underline}
.m a{color:inherit;font-weight:700}
.note{max-width:1000px;margin:0 auto;padding:0 20px 32px;color:var(--mute);font-size:13px;text-align:center}
@media(max-width:600px){.top{padding-top:14px}.top h1{font-size:26px}.top p{font-size:14px}.stage{padding:6px 0 0}.blob{display:none}
.phone{width:100%;height:calc(100dvh - 92px);min-height:620px;border:0;border-radius:0;box-shadow:none}.status{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Installed app: fill the whole screen */
html,body{height:100%}body{background:var(--app)}
.stage{padding:0;height:100dvh}
.phone{width:100%;max-width:520px;height:100dvh;min-height:0;border:0;border-radius:0;box-shadow:none;padding-top:env(safe-area-inset-top)}
.status{display:none}
.nav{bottom:calc(14px + env(safe-area-inset-bottom))}
.fab{bottom:calc(96px + env(safe-area-inset-bottom))}
.sheet form{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
@media(min-width:521px){body{background:var(--bg)}.phone{box-shadow:0 0 0 1px var(--line)}}
</style>
</head>
<body>

<div class="stage">
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>Leicester · 7°C</span></div>
    <main class="screen" id="screen" aria-live="polite"></main>
    <button class="fab" id="fab" aria-label="Ask the assistant">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 3l2.2 5.3L20 9l-4.5 3.8L17 19l-5-3-5 3 1.5-6.2L4 9l5.8-.7z"/></svg>Ask
    </button>
    <nav class="nav" id="nav" aria-label="App sections"></nav>
    <section class="sheet" id="sheet" aria-label="Assistant">
      <div class="grab"></div>
      <div class="row" style="padding:8px 16px 4px"><h3 style="margin:0">Ask SettleMate</h3><button class="del" id="close" aria-label="Close assistant">✕</button></div>
      <div class="msgs" id="msgs"></div>
      <div class="chips" id="sugg"></div>
      <form id="ask"><input id="q" placeholder="Ask anything about UK life…" aria-label="Your question"><button class="btn" style="background:var(--blue)">Send</button></form>
    </section>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
{
const ic = {
  home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>',
  arrival:'<path d="M3 17l7-2 4 4 7-14"/><circle cx="5" cy="6" r="2"/>',
  work:'<circle cx="12" cy="13" r="8"/><path d="M12 8v5l3 2M9 2h6"/>',
  money:'<rect x="3" y="6" width="18" height="13" rx="3"/><path d="M16 12.5h2M3 10h18"/>',
  discover:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  cart:'<path d="M3 4h2l2.5 11h11L21 7H6.5"/><circle cx="9" cy="19" r="1.5"/><circle cx="17" cy="19" r="1.5"/>',
  bowl:'<path d="M3 11h18a9 9 0 0 1-18 0zM8 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/>',
  train:'<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 11h14M8 21l2-4M16 21l-2-4"/><circle cx="9" cy="14" r=".8"/><circle cx="15" cy="14" r=".8"/>',
  help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/>'
};
const gsearch = q => 'https://www.google.com/search?q=' + encodeURIComponent(q);
const maps = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const ext = (href, text, cls='go') => `<a class="${cls}" href="${href}" target="_blank" rel="noopener">${text}</a>`;
const taskLinks = {
  'Get a UK SIM card': gsearch('student SIM only deals UK'),
  'Open a UK bank account': 'https://www.moneyhelper.org.uk/en',
  'Check your eVisa and share code': 'https://www.gov.uk/view-prove-immigration-status',
  'Register with a GP': 'https://www.nhs.uk/service-search/find-a-gp',
  'Apply for a National Insurance number': 'https://www.gov.uk/apply-national-insurance-number',
  'Get council tax exemption': 'https://www.gov.uk/council-tax/discounts-for-full-time-students',
  'Buy a 16–25 Railcard': 'https://www.16-25railcard.co.uk'
};
const tabs = [['home','Home'],['arrival','Arrival'],['work','Work'],['money','Money'],['discover','Discover']];

const fresh = {
  tab:'home', xp:20, streak:5,
  tasks:[
    {t:'Get a UK SIM card',d:'Pick a student plan, needed for bank codes',done:true},
    {t:'Open a UK bank account',d:'Bring your university enrolment letter',done:true},
    {t:'Check your eVisa and share code',d:'Sign in to your UKVI account and save a share code',done:false},
    {t:'Register with a GP',d:'Use the NHS "Find a GP" service near you',done:false},
    {t:'Apply for a National Insurance number',d:'Needed before you start a part-time job',done:false},
    {t:'Get council tax exemption',d:'Send your student certificate to the council',done:false},
    {t:'Buy a 16–25 Railcard',d:'Saves a third on most train tickets',done:false}
  ],
  limit:20,
  shifts:[{j:'Warehouse',h:8,day:'Mon'},{j:'Café',h:5,day:'Wed'},{j:'Warehouse',h:4,day:'Fri'}],
  budget:650,
  spend:[{c:'Rent',a:380},{c:'Food',a:62.4},{c:'Transport',a:18},{c:'Fun',a:24},{c:'Send home',a:0}],
  filter:'All',
  joined:['Indian Students Leicester']
};
let S;
try{ S = JSON.parse(localStorage.getItem('settlemate-demo-v2')) || JSON.parse(JSON.stringify(fresh)); }catch(e){ S = JSON.parse(JSON.stringify(fresh)); }
const save = () => { try{ localStorage.setItem('settlemate-demo-v2', JSON.stringify(S)); }catch(e){} };

const catCol = ['#3d6bff','#ff5a3c','#ffc93c','#ff7eb6','#1fbf8f'];
const deals = [
  {n:'Patel Brothers Grocery',k:'Groceries',o:'10% off with student ID',w:'0.4 mi',i:'cart',c:'var(--coralsoft)',f:'var(--coral)'},
  {n:'Golden Dragon Supermarket',k:'Groceries',o:'Rice 10kg £14.50',w:'0.9 mi',i:'cart',c:'var(--coralsoft)',f:'var(--coral)'},
  {n:'Campus Kitchen',k:'Meals',o:'£3.50 lunch deal',w:'On campus',i:'bowl',c:'var(--sunsoft)',f:'#d99a00'},
  {n:'Spice Route Café',k:'Meals',o:'Thali £6, Mon–Thu',w:'0.6 mi',i:'bowl',c:'var(--sunsoft)',f:'#d99a00'},
  {n:'16–25 Railcard',k:'Travel',o:'⅓ off rail fares',w:'Online',u:'https://www.16-25railcard.co.uk',i:'train',c:'var(--bluesoft)',f:'var(--blue)'},
  {n:'City bus term pass',k:'Travel',o:'Student term ticket',w:'City buses',u:gsearch('Leicester student bus term ticket'),i:'train',c:'var(--bluesoft)',f:'var(--blue)'},
  {n:'Money advice drop-in',k:'Help',o:'Free, at the student hub',w:'Campus',u:gsearch('University of Leicester student money advice'),i:'help',c:'var(--mintsoft)',f:'var(--mint)'}
];
const events = [
  {t:'International welcome social',w:'Fri · 7pm · Students’ Union',u:'https://www.eventbrite.co.uk/d/united-kingdom--leicester/students/',a:'#ff5a3c',b:'#ffc93c'},
  {t:'Free pizza study night',w:'Wed · 6pm · Library',u:gsearch('University of Leicester library events'),a:'#3d6bff',b:'#ff7eb6'},
  {t:'Christmas market trip',w:'Sat · 11am · Meet at campus',u:gsearch('Leicester Christmas market'),a:'#1fbf8f',b:'#ffc93c'},
  {t:'Five-a-side football',w:'Sun · 2pm · Sports park',u:maps('five a side football Leicester'),a:'#ff7eb6',b:'#3d6bff'}
];
const groups = [
  {n:'Indian Students Leicester',m:1240,c:'#ffe08a'},{n:'Chinese Students Society',m:980,c:'#ffc9df'},
  {n:'Nigerian Students Network',m:410,c:'#b5efd9'},{n:'Nepali Students UK',m:350,c:'#c9d6ff'},
  {n:'MSc AI 2026 cohort',m:86,c:'#ffd2c7'},{n:'Sunday cricket',m:64,c:'#ffe08a'}
];

const gbp = n => '£' + (Math.round(n*100)/100).toFixed(n % 1 ? 2 : 0);
const hours = () => S.shifts.reduce((a,s)=>a+s.h,0);
const spent = () => S.spend.reduce((a,s)=>a+s.a,0);
const doneCount = () => S.tasks.filter(t=>t.done).length;
const level = () => Math.floor(S.xp/50)+1;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg = (k,stroke='currentColor') => `<svg viewBox="0 0 24 24" fill="none" stroke="${stroke}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ic[k]}</svg>`;
const ring = (p,col,track,w=10) => `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="none" stroke="${track}" stroke-width="${w}"/><circle cx="50" cy="50" r="42" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" pathLength="100" stroke-dasharray="${Math.max(.01,Math.min(100,p))} 100"/></svg>`;
const cover = e => `<svg viewBox="0 0 200 86" preserveAspectRatio="xMidYMid slice"><rect width="200" height="86" fill="${e.a}"/><circle cx="160" cy="20" r="38" fill="${e.b}"/><circle cx="40" cy="96" r="44" fill="${e.b}" opacity=".55"/><path d="M0 70 Q50 50 100 66 T200 60 V86 H0z" fill="#fff" opacity=".25"/><circle cx="110" cy="34" r="6" fill="#fff" opacity=".8"/></svg>`;

const views = {
  home(){
    const h=hours(), left=S.budget-spent(), next=S.tasks.find(t=>!t.done), pct=doneCount()/S.tasks.length*100;
    return `<div class="hello"><div class="avatar">D</div><div style="flex:1"><div class="small">Good morning</div><h2 style="margin:0;font-size:24px">Hey Dinakar!</h2></div>
      <span class="pill" style="background:var(--sunsoft);color:light-dark(#8a6100,#ffc93c)">${S.streak}-day streak</span></div>
    <div class="row" style="margin:-4px 0 12px"><span class="pill" style="background:var(--bluesoft);color:var(--blue)">Level ${level()} · ${S.xp} XP</span>
      <div class="meter" style="flex:1;background:var(--line)"><i style="width:${S.xp%50*2}%;background:var(--blue)"></i></div><span class="small">${50-S.xp%50} XP to next level</span></div>
    <div class="hero"><div><small>Next arrival task</small><div class="disp">${next?esc(next.t):'All settled in!'}</div>
      <button class="btn w" data-go="arrival">${next?'Let’s do it':'View checklist'}</button></div>
      <div class="ring">${ring(pct,'#fff','rgb(255 255 255/.3)',11)}<b>${doneCount()}/${S.tasks.length}</b></div></div>
    <div class="tiles">
      <button class="tile t-blue" data-go="work"><span class="ic">${svg('work')}</span><span><span class="big">${h}h</span><br><span style="font-size:13px;font-weight:600">${h>S.limit?'Over your limit!':(S.limit-h)+'h left this week'}</span></span>
        <span class="meter"><i style="width:${Math.min(100,h/S.limit*100)}%;${h>S.limit?'background:#ff5a3c':''}"></i></span></button>
      <button class="tile t-sun" data-go="money"><span class="ic">${svg('money')}</span><span><span class="big">${gbp(left)}</span><br><span style="font-size:13px;font-weight:600">left this month</span></span>
        <span class="meter"><i style="width:${Math.min(100,spent()/S.budget*100)}%"></i></span></button>
    </div>
    <div class="row"><h3>This week near you</h3><button class="btn soft" data-go="discover" style="min-height:36px;padding:6px 12px;font-size:14px">See all</button></div>
    <div class="hscroll">${events.map(e=>`<a class="event" href="${e.u}" target="_blank" rel="noopener"><div class="cover">${cover(e)}</div><div class="body"><b>${e.t}</b><span class="small">${e.w}</span></div></a>`).join('')}</div>
    <div class="card"><h3>Deals for you</h3>${deals.slice(0,3).map(dealRow).join('')}</div>
    <div class="card" style="background:var(--pinksoft);border:0"><div class="row"><div><h3 style="margin:0 0 2px">Tuition instalment</h3><div class="small">Due 15 January · 53 days to go</div></div><a class="pill" style="background:var(--pink);color:#fff;text-decoration:none" href="${gsearch('University of Leicester pay tuition fees')}" target="_blank" rel="noopener">Pay fees ↗</a></div></div>
    <p class="small" style="text-align:center">Prototype with sample data. Rules are simplified, so check your visa conditions on gov.uk.</p>`;
  },
  arrival(){
    const pct=Math.round(doneCount()/S.tasks.length*100);
    return `<h2>Arrival checklist</h2><p class="sub">Your first weeks in the UK, in the right order. Each task earns 10 XP.</p>
    <div class="card" style="background:var(--mintsoft);border:0"><div class="row"><div><div class="big" style="color:var(--mint)">${pct}%</div><div class="small" style="font-weight:600">${pct===100?'You’re officially settled!':'settled in, keep going'}</div></div>
      <div class="ring" style="width:72px;height:72px">${ring(pct,'var(--mint)','rgb(31 191 143/.2)',12)}</div></div></div>
    ${S.tasks.map((t,i)=>`<div class="task ${t.done?'done':''}">
      <button class="tick" data-tick="${i}" aria-pressed="${t.done}" aria-label="Mark ${esc(t.t)} ${t.done?'not done':'done'}">${t.done?'✓':''}</button>
      <div style="flex:1"><b>${esc(t.t)}</b><div class="small">${esc(t.d)}</div>${taskLinks[t.t]?ext(taskLinks[t.t],'Open guide ↗'):''}</div><span class="xp">+10</span></div>`).join('')}`;
  },
  work(){
    const h=hours(), over=h>S.limit, near=!over&&h>=S.limit-3;
    const col = over?'var(--coral)':near?'var(--sun)':'var(--blue)';
    return `<h2>Work hours</h2><p class="sub">This week, Monday to Sunday · term time</p>
    <div class="card"><div class="gauge"><div class="ring">${ring(h/S.limit*100,col,'var(--line)',12)}<b>${h}h<span>of ${S.limit}h</span></b></div>
      <div><div class="small" style="font-weight:600">Weekly limit</div>
      <div class="chips" style="padding:4px 0">${[20,10].map(v=>`<button data-limit="${v}" aria-pressed="${S.limit===v}">${v}h</button>`).join('')}</div>
      <div class="small">${S.shifts.length} shift${S.shifts.length===1?'':'s'} logged</div></div></div>
      ${over?`<div class="alert r">You're ${h-S.limit}h over your limit. Working over it can breach your visa conditions.</div>`:
        near?`<div class="alert y">Only ${S.limit-h}h left this week. Plan your next shift carefully.</div>`:
        `<div class="alert g">You're safely within your limit.</div>`}
    </div>
    <div class="card"><h3>Log a shift</h3>
      <form class="add" id="shiftForm"><input id="job" placeholder="Job" value="Warehouse" aria-label="Job name">
      <input id="hrs" type="number" min="0.5" max="12" step="0.5" value="4" aria-label="Hours"><button class="btn">Add</button></form>
      <ul class="list" style="margin-top:8px">${S.shifts.map((s,i)=>`<li><span class="group"><span class="gav" style="background:${s.j.toLowerCase().includes('caf')?'#ffe08a':'#c9d6ff'};width:36px;height:36px;border-radius:12px;font-size:13px">${esc(s.day)}</span><b>${esc(s.j)}</b></span>
        <span class="row"><span class="num">${s.h}h</span><button class="del" data-delshift="${i}" aria-label="Remove shift">✕</button></span></li>`).join('')}</ul>
    </div>
    <p class="small">University holidays count as vacation, when full-time work may be allowed. Check your own visa.<br>${ext('https://www.gov.uk/student-visa','Student visa work rules on gov.uk ↗')}</p>`;
  },
  money(){
    const sp=spent(), left=S.budget-sp;
    let acc=0;
    const arcs=S.spend.filter(s=>s.a>0).map(s=>{const i=S.spend.indexOf(s),p=s.a/Math.max(sp,1)*100,o=acc;acc+=p;
      return `<circle cx="50" cy="50" r="40" fill="none" stroke="${catCol[i]}" stroke-width="16" pathLength="100" stroke-dasharray="${Math.max(p-1,.1)} ${100-Math.max(p-1,.1)}" stroke-dashoffset="${-o}"/>`}).join('');
    return `<h2>Money</h2><p class="sub">November budget</p>
    <div class="card" style="background:${left<0?'var(--coralsoft)':'#ffe08a'};border:0;color:#1b1d2e"><div class="row"><div><div style="font-size:13px;font-weight:600">Left to spend</div><div class="big" style="font-size:40px">${gbp(left)}</div></div>
      <label style="text-align:right;font-size:13px;font-weight:600">Budget<input id="budget" type="number" value="${S.budget}" style="width:96px;text-align:right;display:block;margin-top:2px;background:rgb(255 255 255/.7);border-color:transparent;color:#1b1d2e" aria-label="Monthly budget in pounds"></label></div>
      <div class="meter" style="margin-top:12px"><i style="width:${Math.min(100,sp/S.budget*100)}%"></i></div>
      <div style="font-size:13px;margin-top:6px;font-weight:600">${gbp(sp)} spent · about ${gbp(Math.max(0,left)/7)} a day for the next week</div></div>
    <div class="card"><h3>Quick add</h3><div class="chips quick">
      ${[['Coffee',3,'Food'],['Meal deal',4,'Food'],['Groceries',20,'Food'],['Bus',2,'Transport'],['Cinema',8,'Fun']].map(([n,a,c])=>`<button data-quick="${c}|${a}">${n} £${a}</button>`).join('')}</div>
      <form class="add" id="spendForm" style="margin-top:6px"><select id="cat" aria-label="Category">${S.spend.map(s=>`<option>${s.c}</option>`).join('')}</select>
      <input id="amt" type="number" min="0.01" step="0.01" value="5" aria-label="Amount in pounds"><button class="btn">Add</button></form></div>
    <div class="card"><h3>Where it went</h3><div class="donut"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="16"/>${arcs}</svg>
      <div class="legend">${S.spend.map((s,i)=>`<div><i style="background:${catCol[i]}"></i><span>${s.c}</span><span class="num">${gbp(s.a)}</span></div>`).join('')}</div></div></div>
    <div class="card" style="background:var(--bluesoft);border:0"><h3 style="color:var(--blue)">Sending money home?</h3><div class="small">Compare rates and fees from regulated providers first. SettleMate never holds your money.</div>${ext('https://www.moneyhelper.org.uk/en','Money guides on MoneyHelper ↗')} ${ext(gsearch('compare international money transfer fees UK'),'Compare transfer fees ↗')}</div>`;
  },
  discover(){
    const kinds=['All','Groceries','Meals','Travel','Help'];
    const list=deals.filter(d=>S.filter==='All'||d.k===S.filter);
    return `<h2>Discover</h2><p class="sub">Deals, food, events and your people.</p>
    <div class="chips">${kinds.map(k=>`<button data-filter="${k}" aria-pressed="${S.filter===k}">${k}</button>`).join('')}</div>
    <div class="card">${list.map(dealRow).join('')}</div>
    <h3>Events</h3>
    <div class="hscroll">${events.map(e=>`<a class="event" href="${e.u}" target="_blank" rel="noopener"><div class="cover">${cover(e)}</div><div class="body"><b>${e.t}</b><span class="small">${e.w}</span></div></a>`).join('')}</div>
    <h3>Find your people</h3>
    <div class="card"><ul class="list">${groups.map(g=>{const j=S.joined.includes(g.n);return `<li><span class="group"><span class="gav" style="background:${g.c}">${g.n.split(' ').map(w=>w[0]).slice(0,2).join('')}</span><span><b>${g.n}</b><br><span class="small">${g.m.toLocaleString()} members · </span>${ext('https://www.facebook.com/search/groups/?q='+encodeURIComponent(g.n),'Find online ↗')}</span></span>
      <button class="btn ${j?'soft':''}" data-join="${esc(g.n)}" style="min-width:76px">${j?'Joined':'Join'}</button></li>`}).join('')}</ul></div>`;
  }
};
function dealRow(d){
  return `<a class="deal" href="${d.u||maps(d.n+' Leicester')}" target="_blank" rel="noopener" aria-label="${esc(d.n)}, opens ${d.u?'website':'Google Maps'}"><div class="badge" style="background:${d.c}">${svg(d.i,d.f)}</div>
  <div style="flex:1"><b>${esc(d.n)}</b><div class="small">${esc(d.o)}</div></div><span class="small" style="white-space:nowrap;font-weight:600">${d.w} ↗</span></a>`;
}

const phone=document.getElementById('phone'), screen=document.getElementById('screen'), nav=document.getElementById('nav'), toastEl=document.getElementById('toast');
function render(){
  nav.innerHTML = tabs.map(([k,l])=>`<button data-go="${k}" aria-current="${S.tab===k}">${svg(k)}${l}</button>`).join('');
  screen.innerHTML = views[S.tab]();
  save();
}
function go(t){ S.tab=t; render(); screen.scrollTop=0; }
let tt;
function toast(t){ toastEl.textContent=t; toastEl.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>toastEl.classList.remove('show'),1600); }
function confetti(x,y){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols=['#ff5a3c','#ffc93c','#3d6bff','#1fbf8f','#ff7eb6'];
  for(let i=0;i<22;i++){
    const c=document.createElement('i'); c.className='conf';
    c.style.left=x+'px'; c.style.top=y+'px'; c.style.background=cols[i%5];
    c.style.setProperty('--dx',(Math.random()*220-110)+'px'); c.style.setProperty('--dy',(Math.random()*-160+40)+'px'); c.style.setProperty('--r',(Math.random()*540)+'deg');
    phone.appendChild(c); setTimeout(()=>c.remove(),1200);
  }
}
function addXp(n,msg){
  const lv=level(); S.xp=Math.max(0,S.xp+n);
  if(n>0) toast(level()>lv?`Level up! You're now level ${level()}`:`+${n} XP · ${msg}`);
}

phone.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.go) go(b.dataset.go);
  else if(b.dataset.tick){
    const t=S.tasks[+b.dataset.tick]; t.done=!t.done;
    if(t.done){ const r=b.getBoundingClientRect(), p=phone.getBoundingClientRect(); confetti(r.left-p.left+17,r.top-p.top+17); addXp(10,'task done'); } else S.xp=Math.max(0,S.xp-10);
    const st=screen.scrollTop; render(); screen.scrollTop=st;
  }
  else if(b.dataset.delshift){ S.shifts.splice(+b.dataset.delshift,1); render(); }
  else if(b.dataset.limit){ S.limit=+b.dataset.limit; render(); }
  else if(b.dataset.filter){ S.filter=b.dataset.filter; render(); }
  else if(b.dataset.quick){ const [c,a]=b.dataset.quick.split('|'); S.spend.find(s=>s.c===c).a+=+a; toast(`Added £${a} to ${c}`); const st=screen.scrollTop; render(); screen.scrollTop=st; }
  else if(b.dataset.join){ const n=b.dataset.join; if(S.joined.includes(n)) S.joined=S.joined.filter(x=>x!==n); else { S.joined=[...S.joined,n]; addXp(5,'joined a group'); } const st=screen.scrollTop; render(); screen.scrollTop=st; }
});
screen.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='shiftForm'){
    const h=parseFloat(document.getElementById('hrs').value), j=document.getElementById('job').value.trim()||'Shift';
    if(h>0){ const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun']; S.shifts.push({j,h,day:days[S.shifts.length%7]}); addXp(2,'shift logged'); render(); }
  }
  if(e.target.id==='spendForm'){
    const a=parseFloat(document.getElementById('amt').value), c=document.getElementById('cat').value;
    if(a>0){ S.spend.find(s=>s.c===c).a+=a; toast(`Added ${gbp(a)} to ${c}`); render(); }
  }
});
screen.addEventListener('change', e=>{
  if(e.target.id==='budget'){ const v=parseFloat(e.target.value); if(v>0){ S.budget=v; render(); } }
});

/* Assistant (scripted demo answers) */
const sheet=document.getElementById('sheet'), msgs=document.getElementById('msgs'), q=document.getElementById('q');
const answers=[
  [/gp|doctor|nhs|ill|sick/i,'Search "Find a GP" on the NHS website, pick a practice near your address and fill in their registration form. It’s free. For urgent advice, use NHS 111.','https://www.nhs.uk/service-search/find-a-gp','Find a GP on NHS'],
  [/hour|work|job|shift/i,'Most degree-level students can work up to 20 hours a week in term time. Your Work tab tracks every shift and warns you before you reach your limit.','https://www.gov.uk/student-visa','Student visa rules on gov.uk'],
  [/bank|account/i,'Most UK banks let students open an account online. You usually need your passport or eVisa and a letter from your university confirming your address.','https://www.moneyhelper.org.uk/en','Banking guides on MoneyHelper'],
  [/ni|national insurance/i,'Apply for a National Insurance number on gov.uk. You can start work before it arrives, but tell your employer you’ve applied.','https://www.gov.uk/apply-national-insurance-number','Apply on gov.uk'],
  [/visa|share code|evisa/i,'You can view your eVisa and get a share code for employers or landlords on gov.uk.','https://www.gov.uk/view-prove-immigration-status','View your eVisa'],
  [/rail|train|travel|bus/i,'A 16–25 Railcard gives a third off most rail fares, and many city bus companies sell student term passes. See Discover → Travel.','https://www.16-25railcard.co.uk','Get a 16–25 Railcard'],
  [/money|budget|send|transfer|cheap/i,'Set your monthly budget in the Money tab and use quick add for everyday spending. To send money home, compare a few regulated providers first.','https://www.moneyhelper.org.uk/en','Money guides on MoneyHelper'],
  [/friend|lonely|people|society/i,'Try Discover → Find your people. Joining a society or a weekly event is the fastest way to make friends. Your university’s wellbeing team is there too if you’re struggling.','https://www.eventbrite.co.uk/d/united-kingdom--leicester/students/','Student events near you']
];
const sugg=['How do I register with a GP?','How many hours can I work?','Cheapest way to travel?','How do I make friends?'];
document.getElementById('sugg').innerHTML=sugg.map(s=>`<button data-ask="${s}">${s}</button>`).join('');
function say(t,who,link){ msgs.insertAdjacentHTML('beforeend',`<div class="m ${who}">${esc(t)}${link?`<br><a href="${link[0]}" target="_blank" rel="noopener">${esc(link[1])} ↗</a>`:''}</div>`); msgs.scrollTop=msgs.scrollHeight; }
function ask(v){
  say(v,'me');
  const hit=answers.find(([r])=>r.test(v));
  setTimeout(()=>hit?say(hit[1],'bot',[hit[2],hit[3]]):say('I don’t have a demo answer for that yet. Here’s a web search to get you started.','bot',[gsearch(v+' UK international student'),'Search the web']),450);
}
say('Hi Dinakar! I can help with GP, banking, work hours, travel, money and making friends. What do you need?','bot');
document.getElementById('sugg').addEventListener('click',e=>{ const b=e.target.closest('button'); if(b) ask(b.dataset.ask); });
document.getElementById('fab').addEventListener('click',()=>{ sheet.classList.add('open'); q.focus(); });
document.getElementById('close').addEventListener('click',()=>sheet.classList.remove('open'));
document.getElementById('ask').addEventListener('submit',e=>{ e.preventDefault(); const v=q.value.trim(); if(!v) return; q.value=''; ask(v); });

render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
}
</script>
</body>
</html>
