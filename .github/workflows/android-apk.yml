name: Android APK

on:
  push:
    branches: [feat/settlemate-android-apk]
    paths:
      - "flutter/**"
      - ".github/workflows/android-apk.yml"
      - ".github/scripts/**"
      - "tests/**"
      - "package.json"
      - "core.js"
      - "backend/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run repository tests
        run: npm test

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: flutter
        run: flutter create --platforms=android --org com.dinakarnayak --project-name landed .

      - name: Apply Landed Android settings (label, no cloud backup, signing)
        working-directory: flutter
        run: python3 ../.github/scripts/prepare-android.py

      - name: Install Flutter dependencies
        working-directory: flutter
        run: |
          flutter pub get
          echo "Resolved packages:"
          flutter pub deps --style=compact --no-dev | head -40

      - name: Analyze Flutter app
        working-directory: flutter
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run Flutter tests
        working-directory: flutter
        run: flutter test

      - name: Load release signing key
        env:
          KEYSTORE_B64: ${{ secrets.LANDED_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/landed-release.jks"
            echo "LANDED_KEYSTORE=$RUNNER_TEMP/landed-release.jks" >> "$GITHUB_ENV"
            echo "Using the Landed release key."
          else
            echo "::warning::LANDED_KEYSTORE_BASE64 secret not set. Signing with a temporary debug key, so installs can't be updated in place."
          fi

      - name: Build release APK
        working-directory: flutter
        env:
          LANDED_KEYSTORE_PASSWORD: ${{ secrets.LANDED_KEYSTORE_PASSWORD }}
          LANDED_KEY_ALIAS: landed
        run: |
          flutter build apk --release \
            --dart-define=FIREBASE_API_KEY=${{ secrets.FIREBASE_API_KEY }} \
            --dart-define=FIREBASE_APP_ID=${{ secrets.FIREBASE_APP_ID }} \
            --dart-define=FIREBASE_SENDER_ID=${{ secrets.FIREBASE_SENDER_ID }} \
            --dart-define=FIREBASE_PROJECT_ID=${{ secrets.FIREBASE_PROJECT_ID }}
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/Landed.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Show signing fingerprints (add these to Firebase)
        working-directory: flutter
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          $APKSIGNER verify --print-certs build/app/outputs/flutter-apk/Landed.apk | grep -E "SHA-1|SHA-256"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Landed-Android
          path: flutter/build/app/outputs/flutter-apk/Landed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish to the Landed beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view landed-beta > /dev/null 2>&1 || \
            gh release create landed-beta --prerelease --target "$GITHUB_SHA" --title "Landed beta" \
              --notes "Latest Landed Android beta."
          cat > notes.md <<NOTES
          Latest Landed Android beta, built from ${GITHUB_SHA::7} on $(date -u +'%d %b %Y %H:%M UTC').

          **Install:** open this page on your Android phone, tap **Landed.apk**, and allow installing from your browser if asked.

          **Demo:** \`landed-demo.mp4\` shows the app running.

          Private by design: personal data stays encrypted on the phone. No ads, no trackers.
          NOTES
          gh release edit landed-beta --notes-file notes.md
          gh release upload landed-beta flutter/build/app/outputs/flutter-apk/Landed.apk --clobber
