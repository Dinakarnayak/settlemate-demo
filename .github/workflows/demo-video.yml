name: Demo video

# Records a screen video of the real app on a free Android emulator.
on:
  push:
    branches: [feat/settlemate-android-apk]
    paths:
      - "flutter/integration_test/**"
      - ".github/workflows/demo-video.yml"
      - ".github/scripts/record-demo.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare app
        working-directory: flutter
        run: |
          flutter create --platforms=android --org com.dinakarnayak --project-name landed .
          python3 ../.github/scripts/prepare-android.py > /dev/null
          flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tour on emulator and record
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: flutter
          script: bash ../.github/scripts/record-demo.sh

      - name: Make a shareable MP4
        run: |
          sudo apt-get install -y ffmpeg > /dev/null
          ffmpeg -y -i flutter/demo-raw.mp4 -vf "scale=720:-2,fps=30" -c:v libx264 -preset veryfast -crf 24 -pix_fmt yuv420p -movflags +faststart -an landed-demo.mp4
          ls -la landed-demo.mp4

      - uses: actions/upload-artifact@v4
        with:
          name: Landed-demo-video
          path: landed-demo.mp4
          retention-days: 30
